# Production / полный стек на VPS (как МОСКАСТИНГ).
# Локально только Postgres: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gadalka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gadalka}
      POSTGRES_DB: gadalka
    volumes:
      - gadalka_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadalka -d gadalka"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://gadalka:${POSTGRES_PASSWORD:-gadalka}@postgres:5432/gadalka?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-docker-secret-min-32-characters-long}
      AUTH_URL: ${AUTH_URL:-https://YOUR_DOMAIN.ru}
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Гадалка}
      UPLOAD_DIR: public/uploads
    volumes:
      - gadalka_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  gadalka_pg:
  gadalka_uploads:
  caddy_data:
  caddy_config:
