# Только PostgreSQL для локальной разработки (npm run dev на хосте)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gadalka
      POSTGRES_PASSWORD: gadalka
      POSTGRES_DB: gadalka
    ports:
      - "5432:5432"
    volumes:
      - gadalka_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadalka -d gadalka"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  gadalka_pg_dev:
